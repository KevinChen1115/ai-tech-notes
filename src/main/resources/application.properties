spring.application.name=ai-tech-notes
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_tech_notes}
spring.datasource.username=${DB_USERNAME:kevin}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.threads.virtual.enabled=true
gemini.api.key=${GEMINI_API_KEY:fake-key}
gemini.model-id=${GEMINI_MODEL_ID:gemini-3.1-flash-lite-preview}
discord.webhook.url=${DISCORD_WEBHOOK_URL:https://fake-webhook}
spring.task.scheduling.pool.size=1
spring.sql.init.mode=never